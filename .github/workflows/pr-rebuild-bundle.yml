name: PR Rebuild Bundle

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  build:
    permissions:
      pull-requests: write
      contents: read
    if: >
      github.event.issue.pull_request &&
      (github.event.comment.body == '/rebuild-bundle' ||
       startsWith(github.event.comment.body, '/rebuild-bundle ')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}

    steps:
      - name: Add reaction to comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Resolve PR head
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            })
            if (pr.state !== 'open') {
              core.setFailed('PR is not open')
              return
            }
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork PRs are not supported')
              return
            }
            core.setOutput('branch', pr.head.ref)
            core.setOutput('sha', pr.head.sha)

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dev/package-lock.json

      - name: Rebuild inst/bundle.js
        working-directory: dev
        run: |
          npm install --ignore-scripts
          npx --no --ignore-scripts browserify entry.js -o ../inst/bundle.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-output
          path: |
            inst/bundle.js
            dev/package-lock.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ needs.build.outputs.branch }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuild-output
          path: .

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inst/bundle.js dev/package-lock.json
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: rebuild inst/bundle.js"
          # Rejected as non-fast-forward if the branch moved since the build
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.commit.outcome }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Backticks are literal markdown
          # shellcheck disable=SC2016
          if [[ "$OUTCOME" == "success" && "$COMMITTED" == "true" ]]; then
            printf -v body 'Rebuilt `inst/bundle.js` in %s. CI does not run on bot commits: close and reopen this PR (or push an empty commit) to run checks.' "$COMMIT_SHA"
          elif [[ "$OUTCOME" == "success" ]]; then
            body='`inst/bundle.js` is already up to date.'
          else
            printf -v body 'Rebuild failed. If the branch changed during the rebuild, comment `/rebuild-bundle` again. See %s.' "$run_url"
          fi
          gh pr comment "$PR_NUMBER" --body "$body"
