name: PR Rebuild Bundle

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  build:
    permissions:
      pull-requests: write
      contents: read
    if: >
      github.event.issue.pull_request &&
      (github.event.comment.body == '/rebuild-bundle' ||
       startsWith(github.event.comment.body, '/rebuild-bundle ')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}

    steps:
      - name: Add reaction to comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Resolve PR head
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            })
            if (pr.state !== 'open') {
              core.setFailed('PR is not open')
              return
            }
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork PRs are not supported')
              return
            }
            core.setOutput('branch', pr.head.ref)
            core.setOutput('sha', pr.head.sha)

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dev/package-lock.json

      - name: Rebuild inst/bundle.js
        working-directory: dev
        run: |
          npm install --ignore-scripts
          npx --no --ignore-scripts browserify entry.js -o ../inst/bundle.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-output
          path: |
            inst/bundle.js
            dev/package-lock.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ needs.build.outputs.branch }}
      BASE_SHA: ${{ needs.build.outputs.sha }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuild-output
          path: rebuild-output

      - name: Commit rebuild outputs via API
        id: commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const base = process.env.BASE_SHA
            const files = [
              ['inst/bundle.js', 'rebuild-output/inst/bundle.js'],
              ['dev/package-lock.json', 'rebuild-output/dev/package-lock.json'],
            ]
            const { data: baseCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: base })
            const tree = await Promise.all(files.map(async ([path, local]) => {
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content: fs.readFileSync(local).toString('base64'), encoding: 'base64',
              })
              return { path, mode: '100644', type: 'blob', sha: blob.sha }
            }))
            const { data: newTree } = await github.rest.git.createTree({
              owner, repo, base_tree: baseCommit.tree.sha, tree,
            })
            if (newTree.sha === baseCommit.tree.sha) {
              core.setOutput('committed', 'false')
              return
            }
            const { data: commit } = await github.rest.git.createCommit({
              owner, repo, message: 'chore: rebuild inst/bundle.js', tree: newTree.sha, parents: [base],
            })
            // force: false -> 422 if the branch moved since BASE_SHA
            await github.rest.git.updateRef({
              owner, repo, ref: `heads/${process.env.BRANCH}`, sha: commit.sha, force: false,
            })
            core.setOutput('committed', 'true')
            core.setOutput('sha', commit.sha)

      - name: Comment result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTCOME: ${{ steps.commit.outcome }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo
            const { OUTCOME, COMMITTED, COMMIT_SHA } = process.env
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            let body
            if (OUTCOME === 'success' && COMMITTED === 'true') {
              body = `Rebuilt \`inst/bundle.js\` in ${COMMIT_SHA}. CI does not run on bot commits: close and reopen this PR (or push an empty commit) to run checks.`
            } else if (OUTCOME === 'success') {
              body = '`inst/bundle.js` is already up to date.'
            } else {
              body = `Rebuild failed. If the branch changed during the rebuild, comment \`/rebuild-bundle\` again. See ${runUrl}.`
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            })
